<div id="donnees-modele">
  <h3>🌦️ Maximmeteo Model V0.3</h3>
  <p>Chargement des données du modèle...</p>
</div>

<script>
fetch("forecast.json")
  .then(response => response.json())
  .then(data => {
    document.getElementById("donnees-modele").innerHTML = `
      <h3>🌦️ ${data.model}</h3>
      <p>Version : ${data.version}</p>
      <p>Maille : ${data.resolution_km} km</p>
      <p>Grille : ${data.grid.nx} × ${data.grid.ny}</p>
      <p>Température moyenne : ${data.initial_state.temperature_mean.toFixed(1)} °C</p>
      <p>Pression moyenne : ${data.initial_state.pressure_mean.toFixed(2)} hPa</p>
      <p>Humidité moyenne : ${data.initial_state.humidity_mean.toFixed(1)} %</p>
    `;
  })
  .catch(error => {
    document.getElementById("donnees-modele").innerHTML =
      "<p>⚠️ Impossible de charger les données du modèle.</p>";
  });
</script>
